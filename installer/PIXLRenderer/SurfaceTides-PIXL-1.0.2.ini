; PIXL Renderer 1.0.3 Compatibility
; SurfaceTides 1.0.2 tuned integration preset
; Installed only when the SurfaceTides integration is selected in the PIXL FOMOD.
; This is a complete preset and replaces the existing SurfaceTides.ini.

[General]
Enabled=1

[Objects]
; PIXL projects rapid-water detail onto the displaced surface. Hide the reviewed
; attached legacy foam shapes that otherwise intersect the tessellated geometry.
HideAttachedFoam=1
HideIceDecals=0
FloeBobbing=0
FloeCrestFollow=1
FloeExtraLift=4
FloeResponseSeconds=0.12

[Compatibility]
AllowENB=0
AllowCS=0
; PIXL Renderer 1.0.3 Compatibility
AllowPIXL=1
RestoreWaterConstants=1
; Contextual render scales: full wilderness energy, calmer civic/enclosed water.
PIXLCityDisplacementScale=0.55
PIXLInteriorDisplacementScale=0.25

[Simulation]
; 192 x 20 keeps the tested 3840-unit local field and stable CPU/GPU footprint.
Resolution=192
Spacing=20
WaveSpeed=210
Dispersion=180000
; A 0.24 damping coefficient gives an approximate ln(2)/0.24 = 2.89 second
; amplitude half-life, versus 2.17 seconds at the original 0.32 setting.
Damping=0.24
; Continuous forcing is 40% stronger than the original value of 5. Gust impulse
; excitation scales from 5.0 to 9.1 (7 x 1.3), making displacement readable.
Wind=7
GustStrength=1.3
MaxHeight=28
TerrainMask=1
TerrainQueriesPerUpdate=96

[Interaction]
MaxActors=48
Strength=5
RadiusScale=1.6

[Rendering]
Tessellation=1
TessellationMax=64
TessellationSpacing=20
NormalStrength=2.35
DisplacementStrength=2

[Experimental]
ENBWaterIntegration=0
MeshBounds=1
MeshMotionVectors=0
MeshTessellationMax=8
MeshTwoSided=0

[Diagnostics]
LogStats=1
WaterPassTrace=0
RippleTrace=0
DebugView=0
